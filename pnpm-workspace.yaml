packages:
  - "apps/*"
  - "packages/*"

shamefullyHoist: true
strictPeerDependencies: false

overrides:
  webpack: 5.112.2

allowBuilds:
  "@nestjs/core": false
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: false
minimumReleaseAgeExclude:
  - "@nestjs/common@12.3.3"
  - "@nestjs/config@12.1.0"
  - "@nestjs/core@12.3.3"
  - "@nestjs/platform-express@12.3.3"
  - "@nestjs/testing@12.3.3"
  - "@nestjs/mcp@0.0.3"
