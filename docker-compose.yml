x-project-name: &project-name ${COMPOSE_PROJECT_NAME:-projectx}

# Define common service settings to reduce duplication
x-service-common: &service-common
  env_file: .env
  networks:
    - default
  depends_on:
    db:
      condition: service_healthy
    temporal:
      condition: service_started
  environment:
    # Enable file system polling for better file watching in Docker
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    - CHOKIDAR_INTERVAL=500 # Faster interval for detecting changes
    # Debugging and verbose logging
    - DEBUG=turbo*
    - FORCE_COLOR=1
    # Turborepo cache dir inside the container
    - TURBO_CACHE_DIR=/app/.turbo
    - VITE_DEV_SERVER=true
    - NODE_ENV=development
    - NODE_OPTIONS=--max-old-space-size=4096
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    # Mount the entire project directory to ensure all files are visible in the container
    - .:/app:delegated
    # These are anonymous volumes to prevent node_modules from being overwritten by host
    - /app/node_modules
    # Apps node_modules
    - /app/apps/auth/node_modules
    - /app/apps/embeddings/node_modules
    - /app/apps/order/node_modules
    - /app/apps/product/node_modules
    - /app/apps/web/node_modules
    # Packages node_modules
    - /app/packages/core/node_modules
    - /app/packages/db/node_modules
    - /app/packages/email/node_modules
    - /app/packages/embeddings/node_modules
    - /app/packages/models/node_modules
    - /app/packages/payment/node_modules
    - /app/packages/ui/node_modules
    - /app/packages/workflow-client/node_modules
    - /app/packages/workflows/node_modules
    # Frontend files that should not be watched (speeds up the container)
    - /app/apps/web/.vite
    - /app/apps/web/dist

services:
  db:
    # PostGIS + pgvector, see docker/postgres/Dockerfile
    build:
      context: docker/postgres
    image: ${COMPOSE_PROJECT_NAME:-projectx}-postgres:17-3.6-pgvector
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-db
    restart: always
    networks:
      - default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata # Explicit PGDATA path
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 2s # Added start period
    labels:
      - "com.*project-name.service=database"
    expose:
      - "${POSTGRES_PORT:-5432}"
    tmpfs:
      - /tmp
      - /run
      - /run/postgresql

  # S3-compatible object store for product images and 3D assets (RustFS, Apache-2.0).
  # The app only talks the S3 API, so any S3 store works in other environments.
  storage:
    image: rustfs/rustfs:1.0.5
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-storage
    restart: always
    networks:
      - default
    environment:
      # Required: without them RustFS falls back to its well-known default credentials
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - storage_data:/data
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - "com.*project-name.service=storage"

  # Creates the bucket, its public prefix and its expiry rules, then exits
  storage-setup:
    image: amazon/aws-cli:2.40.2
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-storage-setup
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - default
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-projectx-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./deployment/scripts/storage:/scripts:ro
    entrypoint: [ "/bin/sh" ]
    command: /scripts/setup-bucket.sh

  elasticsearch:
    image: elasticsearch:7.17.28
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-elasticsearch
    platform: linux/amd64
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - default
    volumes:
      # Custom search attribute mappings only live in the index, Temporal will not recreate them if this is lost
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - "com.*project-name.service=elasticsearch"

  temporal-admin-tools:
    image: temporalio/admin-tools:1.32.1
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-temporal-admin-tools
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${POSTGRES_PORT:-5432}
      - SQL_PASSWORD=${POSTGRES_PASSWORD}
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_SCHEME=http
      - ES_VERSION=v7
      - ES_VISIBILITY_INDEX=temporal_visibility_v1_dev
    networks:
      - default
    volumes:
      - ./deployment/scripts/temporal:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/setup-postgres-es.sh

  temporal:
    image: temporalio/server:1.32.1
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-temporal
    platform: linux/amd64
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=db
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    networks:
      - default
    volumes:
      - ./deployment/config/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7233" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - "com.*project-name.service=temporal"
    expose:
      - "${TEMPORAL_PORT:-7233}"

  temporal-create-namespace:
    image: temporalio/admin-tools:1.32.1
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-temporal-create-namespace
    platform: linux/amd64
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:${TEMPORAL_PORT:-7233}
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    networks:
      - default
    volumes:
      - ./deployment/scripts/temporal:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.57.0
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-temporal-ui
    platform: linux/amd64
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:${TEMPORAL_PORT:-7233}
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - default
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    labels:
      - "com.*project-name.service=temporal-ui"
    expose:
      - "${TEMPORAL_UI_PORT:-8080}"
    # PROJECTX SERVICES

  # Builder service - runs once to build all packages before app services start
  builder:
    <<: *service-common
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-builder
    # Only the database: Temporal is a dependency of the services that use it, not of the build
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        pnpm install --frozen-lockfile && \
        pnpm turbo run build --filter=auth^... --filter=order^... --filter=product^... --filter=@projectx/embeddings-app... && \
        pnpm --filter @projectx/db run prisma:migrate && \
        pnpm --filter @projectx/db run prisma:seed && \
        echo "Build complete!"
    # No ports needed - this is a one-time build service

  auth:
    <<: *service-common
    container_name: auth
    init: true
    depends_on:
      builder:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cd /app/apps/auth && \
        exec pnpm start:debug
    ports:
      - "${AUTH_PORT:-8081}:${AUTH_PORT:-8081}"
      - "9229:9229"

  order:
    <<: *service-common
    container_name: order
    init: true
    depends_on:
      builder:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cd /app/apps/order && \
        exec pnpm start:debug
    ports:
      - "${ORDER_PORT:-8082}:${ORDER_PORT:-8082}"
      - "9230:9230"

  product:
    <<: *service-common
    container_name: product
    init: true
    depends_on:
      builder:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        cd /app/apps/product && \
        exec pnpm start:debug
    ports:
      - "${PRODUCT_PORT:-8083}:${PRODUCT_PORT:-8083}"
      - "9231:9231"

  # Downloads the pinned model files into the model_cache volume and checks
  # them against models.lock.json, then exits (runs the compiled package,
  # hence after builder)
  model-fetch:
    <<: *service-common
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-model-fetch
    depends_on:
      builder:
        condition: service_completed_successfully
    environment:
      - MODEL_CACHE_DIR=/models
    command:
      - /bin/sh
      - -c
      - exec pnpm --filter @projectx/embeddings models:fetch
    volumes:
      # Mount the entire project directory to ensure all files are visible in the container
      - .:/app:delegated
      # These are anonymous volumes to prevent node_modules from being overwritten by host
      - /app/node_modules
      # Apps node_modules
      - /app/apps/auth/node_modules
      - /app/apps/embeddings/node_modules
      - /app/apps/order/node_modules
      - /app/apps/product/node_modules
      - /app/apps/web/node_modules
      # Packages node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/email/node_modules
      - /app/packages/embeddings/node_modules
      - /app/packages/models/node_modules
      - /app/packages/payment/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/workflow-client/node_modules
      - /app/packages/workflows/node_modules
      # Frontend files that should not be watched (speeds up the container)
      - /app/apps/web/.vite
      - /app/apps/web/dist
      # The only writer of the pinned model files
      - model_cache:/models

  # Query embeddings (text-only session). No Temporal or storage dependency:
  # text search keeps working through either outage. Internal network only.
  embed-text:
    <<: *service-common
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-embed-text
    init: true
    depends_on:
      db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
      model-fetch:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=development
      - FORCE_COLOR=1
      - NODE_OPTIONS=--max-old-space-size=512
      - EMBED_ROLE=text
      - MODEL_CACHE_DIR=/models
    command:
      - /bin/sh
      - -c
      - |
        cd /app/apps/embeddings && \
        exec node dist/main
    volumes:
      # Mount the entire project directory to ensure all files are visible in the container
      - .:/app:delegated
      # These are anonymous volumes to prevent node_modules from being overwritten by host
      - /app/node_modules
      # Apps node_modules
      - /app/apps/auth/node_modules
      - /app/apps/embeddings/node_modules
      - /app/apps/order/node_modules
      - /app/apps/product/node_modules
      - /app/apps/web/node_modules
      # Packages node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/email/node_modules
      - /app/packages/embeddings/node_modules
      - /app/packages/models/node_modules
      - /app/packages/payment/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/workflow-client/node_modules
      - /app/packages/workflows/node_modules
      # Frontend files that should not be watched (speeds up the container)
      - /app/apps/web/.vite
      - /app/apps/web/dist
      # Pinned model files, read-only (written by model-fetch)
      - model_cache:/models:ro
    # RSS of the text-only session is ~880 MB (measured), so 1 GB leaves too little room
    mem_limit: 1536m
    cpus: 2
    expose:
      - "${EMBED_TEXT_PORT:-8085}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:${EMBED_TEXT_PORT:-8085}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m

  # Image queries and the embedAssets activity workers (embeddings-interactive,
  # embeddings-bulk). Internal network only.
  embed-image:
    <<: *service-common
    container_name: ${COMPOSE_PROJECT_NAME:-projectx}-embed-image
    init: true
    depends_on:
      db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
      model-fetch:
        condition: service_completed_successfully
      storage-setup:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - FORCE_COLOR=1
      - NODE_OPTIONS=--max-old-space-size=1024
      - EMBED_ROLE=image
      - MODEL_CACHE_DIR=/models
    command:
      - /bin/sh
      - -c
      - |
        cd /app/apps/embeddings && \
        exec node dist/main
    volumes:
      # Mount the entire project directory to ensure all files are visible in the container
      - .:/app:delegated
      # These are anonymous volumes to prevent node_modules from being overwritten by host
      - /app/node_modules
      # Apps node_modules
      - /app/apps/auth/node_modules
      - /app/apps/embeddings/node_modules
      - /app/apps/order/node_modules
      - /app/apps/product/node_modules
      - /app/apps/web/node_modules
      # Packages node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/email/node_modules
      - /app/packages/embeddings/node_modules
      - /app/packages/models/node_modules
      - /app/packages/payment/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/workflow-client/node_modules
      - /app/packages/workflows/node_modules
      # Frontend files that should not be watched (speeds up the container)
      - /app/apps/web/.vite
      - /app/apps/web/dist
      # Pinned model files, read-only (written by model-fetch)
      - model_cache:/models:ro
    mem_limit: 2560m
    cpus: 4
    expose:
      - "${EMBED_IMAGE_PORT:-8086}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:${EMBED_IMAGE_PORT:-8086}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m

  # Public tunnel to the order service, opt in with `docker compose --profile ngrok up -d`
  ngrok-order:
    image: ngrok/ngrok:latest
    platform: linux/amd64
    profiles:
      - ngrok
    command:
      - "http"
      - "http://host.docker.internal:${ORDER_PORT:-8082}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - 4040:4040

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-projectx}-network
    driver: bridge

volumes:
  elasticsearch_data:
  storage_data:
    name: ${COMPOSE_PROJECT_NAME:-projectx}-storage-data
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-projectx}-postgres-data
  model_cache:
    name: ${COMPOSE_PROJECT_NAME:-projectx}-model-cache
