name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Prisma reads it to generate the client, nothing connects to it
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check the published packages
        run: pnpm check:packages

  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same PostGIS + pgvector image docker compose uses. Job services
      # can't build images, so it runs as a plain container.
      - name: Build the Postgres image
        run: docker build -t projectx-postgres docker/postgres
      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            --health-cmd "pg_isready -h 127.0.0.1 -U ci -d ci" --health-interval 2s \
            --health-timeout 5s --health-retries 30 \
            projectx-postgres
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' postgres)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs postgres
          exit 1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm --filter @projectx/db prisma:generate
      - name: Build the packages the tests import
        run: pnpm turbo run build --filter=@projectx/db^...
      - name: Apply the migrations to an empty database
        run: pnpm --filter @projectx/db prisma:migrate
      - name: Upgrade and seed a database with legacy data
        run: pnpm --filter @projectx/db test:integration
      - name: Check catalog.json against the pinned datasets
        run: pnpm --filter @projectx/db catalog:check
      # The same RustFS image and bucket setup docker compose uses, for the
      # embeddings S3 round trip
      - name: Start the object store
        env:
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-access-key
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY_ID" -e RUSTFS_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            -e RUSTFS_VOLUMES=/data -e RUSTFS_ADDRESS=:9000 \
            rustfs/rustfs:1.0.5
          docker run --rm --network host \
            -e S3_ENDPOINT=http://localhost:9000 -e S3_BUCKET=projectx-assets -e S3_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            -v "$PWD/deployment/scripts/storage:/scripts:ro" \
            --entrypoint /bin/sh amazon/aws-cli:2.40.2 /scripts/setup-bucket.sh
      - name: Build the packages the embeddings tests import
        run: pnpm turbo run build --filter=@projectx/embeddings-app^...
      - name: Embeddings contract tests against the repository and RustFS
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: projectx-assets
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-access-key
        run: pnpm --filter @projectx/embeddings-app test:integration
